[package]
name = "airo_core"
version = "0.1.0"
edition = "2021"
description = "Airo platform core — high-performance Rust engines for playlist, EPG, search and dedup"
license = "MIT"

[lib]
name = "airo_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
memchr = "2"
memmap2 = "0.9"
quick-xml = "0.38"
rusqlite = "0.32"

[dev-dependencies]
criterion = "0.5"
libc = "0.2"
tempfile = "3"

[[bench]]
name = "m3u_parser"
harness = false

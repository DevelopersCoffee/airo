[package]
name = "airo_mind_eval"
version = "0.1.0"
edition = "2021"
description = "Airo Mind golden-dataset evaluation pipeline -- WER, term accuracy, extraction F1, numeric, grounding, MoM quality gates. #1636. Local dev tool, not shipped product code; not run in CI."
license = "MIT"
publish = false

# Both a library (each metric is independently testable, `cargo test -p
# airo_mind_eval`) and a `src/main.rs` CLI binary that wires them into one
# pipeline run -- the same lib+bin shape the workspace already uses to keep a
# dev-tool's logic testable without needing a process boundary, and matching
# `airo_mind_cli`'s closest-precedent role as the local-only entry point.
[lib]
name = "airo_mind_eval"
crate-type = ["rlib"]

[dependencies]
# The engine boundary (`GenerationEngine`, `RuntimeStats`) -- the LLM-judge
# call site and the performance section reuse these shapes rather than
# inventing eval-only ones.
airo_mind_core = { path = "../airo_mind_core" }
# `Segment`, and the technical-term dictionary the ASR term-accuracy metric
# scores against (`normalize::technical_terms`).
airo_mind_transcript = { path = "../airo_mind_transcript" }
# `MeetingIr`/`Facts` shape, and `dedup::is_near_duplicate` -- extraction F1
# matches predicted facts against the golden IR with the same semantic-match
# heuristic Pass 2 itself uses to merge duplicates.
airo_mind_meeting = { path = "../airo_mind_meeting" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

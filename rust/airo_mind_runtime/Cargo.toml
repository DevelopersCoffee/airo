[package]
name = "airo_mind_runtime"
version = "0.1.0"
edition = "2021"
description = "Airo Mind runtime — Supervisor and inference engine boundary."
license = "MIT"

[lib]
name = "airo_mind_runtime"
# cdylib for Flutter (#1401), staticlib for iOS, rlib so the tests and any
# in-process consumer keep the real types rather than going through the FFI
# boundary. Nothing below `api` knows the bridge exists.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The backend-free half: Supervisor, engine traits, store, index, wav, models.
# Carries no native dependency, which is what lets both engine cdylibs link it
# without re-creating the ggml conflict that forced them apart.
airo_mind_core = { path = "../airo_mind_core" }
# Pinned to the exact version core_native already uses. Two flutter_rust_bridge
# versions in one Flutter app is a link-time conflict, not a warning.
flutter_rust_bridge = "=2.11.1"
# The Supervisor itself takes nothing. Backends are feature-gated so a build
# that only needs the engine boundary -- CI, the web target, a capability test
# -- does not compile whisper.cpp.
whisper-rs = { version = "0.16", optional = true }
# `default-features = false` is a CORRECTNESS setting, not a size one.
#
# llama-cpp-2's default features include `common`, which compiles llama.cpp's
# `download.cpp` and `hf-cache.cpp` -- a HuggingFace HTTP client -- into the
# binary. `ADR-0018 §1` says the runtime never acquires models, and "cloud
# optional, never cloud required" is not a claim a binary carrying a model
# downloader can make. It also does not link: httplib is not in the archive,
# so the offline product and the building product happen to be the same one.
#
# Dropping the default `openmp` costs nothing here: the Supervisor owns the CPU
# budget (`C6`) and the engine is pinned to one thread.
llama-cpp-2 = { version = "0.1.153", optional = true, default-features = false }
# Re-exported by llama-cpp-2 for token_to_piece; pinned to the version it uses.
encoding_rs = { version = "0.8", optional = true }

[features]
# The Flutter build turns both on -- the app has no reason to exist without
# them. CI keeps the default so a boundary check does not compile whisper.cpp.
default = []
# Everything a shipped app needs. Named so the build wiring has one thing to
# pass and cannot drift from what the UI assumes is present.
app = ["whisper", "llama"]
# Real offline transcription. Requires cmake and a C++ toolchain, and pulls in
# whisper.cpp. Constitution §6 scorecard owed before this leaves a dev build.
whisper = ["dep:whisper-rs"]
# Real offline generation. Same toolchain requirement and the same §6 debt.
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

[lints.rust]
# `#[frb(sync)]` expands to code guarded on `cfg(frb_expand)`, which the
# generator sets and cargo does not. Declaring it keeps clippy at zero without
# blanket-allowing unexpected cfgs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

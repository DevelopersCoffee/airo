[package]
name = "airo_mind_runtime"
version = "0.1.0"
edition = "2021"
description = "Airo Mind runtime — Supervisor and inference engine boundary."
license = "MIT"

[lib]
name = "airo_mind_runtime"
# rlib only. Nothing crosses FFI yet; declaring cdylib links an empty artifact
# on every CI push.
crate-type = ["rlib"]

[dependencies]
# The Supervisor itself takes nothing. Backends are feature-gated so a build
# that only needs the engine boundary -- CI, the web target, a capability test
# -- does not compile whisper.cpp.
whisper-rs = { version = "0.16", optional = true }

[features]
default = []
# Real offline transcription. Requires cmake and a C++ toolchain, and pulls in
# whisper.cpp. Constitution §6 scorecard owed before this leaves a dev build.
whisper = ["dep:whisper-rs"]

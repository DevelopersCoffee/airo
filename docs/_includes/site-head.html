<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page.title }}</title>
<meta name="title" content="{{ page.title }}" />
<meta name="description" content="{{ page.description }}" />
<meta name="robots" content="index, follow" />
<meta name="google-site-verification" content="WusRxM2aVnZImHcic5ehEu-ticQ4L645xgLhu13kmro" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta name="theme-color" content="#071010" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:title" content="{{ page.title }}" />
<meta property="og:description" content="{{ page.description }}" />
<meta
  property="og:image"
  content="{{ '/store-assets/airo-tv/feature-graphic-1024x500.png' | absolute_url }}"
/>
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title }}" />
<meta name="twitter:description" content="{{ page.description }}" />
<!-- AI Agent & LLM Auto-Discovery -->
<link rel="llms-txt" type="text/markdown" href="{{ '/llms.txt' | relative_url }}" />
<link rel="agent" type="text/markdown" href="{{ '/llms.txt' | relative_url }}" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" />
<link rel="stylesheet" href="{{ '/assets/airo-tv/site.css' | relative_url }}" />
<script defer src="{{ '/assets/airo-tv/third-party/lucide.min.js' | relative_url }}"></script>
<script defer src="{{ '/assets/airo-tv/site.js' | relative_url }}"></script>
{% if page.structured_data %}
<script type="application/ld+json">
  {{ page.structured_data | jsonify }}
</script>
{% endif %}

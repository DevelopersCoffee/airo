# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Enable custom_lint plugin
  plugins:
    - custom_lint

  exclude:
    - "build/**"
    - ".dart_tool/**"
    - "**/generated/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Patrol suites resolve only under the patrol flavour. `patrol` is not a
    # dependency of app/pubspec.yaml -- the flavour pubspecs are separate, so a
    # dependency in one is invisible to the others -- which makes every symbol
    # in these files unresolvable in the default analysis and produced 12 hard
    # errors that failed `analyze` and `code-quality` on every PR. Analysing
    # them here checks nothing; it only hides the errors that matter.
    - "integration_test/patrol_test.dart"
    - "patrol_test/**"
    # Same reason, same shape: `main_mind.dart` resolves only under
    # pubspec_mind.yaml, and `feature_mind` is not a dependency of
    # app/pubspec.yaml. Analysing it against the phone flavour checks it
    # against a dependency set it was never meant to have.
    #
    # Adding feature_mind to app/pubspec.yaml the way feature_coin is there
    # would fix the analysis and break the product: feature_mind declares
    # cargokit hooks, so every phone build would cross-compile whisper.cpp and
    # llama.cpp through the NDK and carry the native code for a feature this
    # flavour does not ship.
    #
    # The shell's own suite lives in `test_mind/`, excluded for the same
    # dependency reason. `flutter test` with no arguments walks `test/` only,
    # so the phone suite never tries to compile the Mind shell; the Mind suite
    # runs under the Mind flavour instead:
    #
    #   cp app/pubspec_mind.yaml app/pubspec.yaml
    #   cd app && flutter pub get && flutter test test_mind/
    #
    # KNOWN GAP: that command does not pass at HEAD, and nothing else covers
    # these files either -- `app/tool/run_mind_macos.sh` builds against the
    # un-expanded `pubspec_mind.yaml`, which still carries only `flutter` and
    # `feature_mind`, so it cannot compile a shell that also needs
    # core_product_shell, feature_assistant, go_router, riverpod and
    # firebase_core. The Mind entrypoint is therefore UNCOVERED -- no analysis,
    # no build, no CI -- until `pubspec_mind.yaml` is expanded and a Mind CI
    # job lands (Airo Mind modular-app tasks 8/9). Do not read this exclusion
    # as "covered elsewhere".
    - "lib/main_mind.dart"
    - "lib/core/mind/**"
    - "test_mind/**"

  # Treat warnings as info to prevent CI failures on non-critical issues
  # Errors will still cause CI to fail
  errors:
    # Treat unused code warnings as info
    unused_import: info
    unused_local_variable: info
    unused_field: info
    unused_result: info
    # Treat deprecated API usage as info
    deprecated_member_use: info
    # Treat style issues as info
    avoid_print: info
    unnecessary_underscores: info
    unnecessary_import: info
    # Keep type errors as warnings (will fail CI)
    invalid_return_type_for_catch_error: warning
    override_on_non_overriding_member: warning
    # Keep async issues as info
    use_build_context_synchronously: info

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # Disable avoid_print for development (use proper logging in production)
    avoid_print: false
    # Enable single quotes
    prefer_single_quotes: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

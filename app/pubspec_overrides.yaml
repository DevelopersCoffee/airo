# Applied by app/tool/run_mind_macos.sh and scripts/verify-mind-macos-e2e.sh.
# Replaces the Android-only llama.cpp plugin so the macOS Mind binary does
# not compile or link JNI/Vulkan from llama_flutter_android.
#
# This file fully replaces `dependency_overrides` in pubspec.yaml (pub's
# rule, not ours). Keep the path forks and stubs from the Mind pubspec here
# or `flutter pub get` silently falls back to pub.dev copies.
#
# Do not use this file for the Android Mind APK (scripts/build-mind.sh).
dependency_overrides:
  llama_flutter_android:
    path: ../packages/stubs/llama_flutter_android_stub
  video_player_avfoundation:
    path: ../packages/platform_player/third_party/video_player_avfoundation
  flutter_chrome_cast:
    path: ../packages/platform_player/third_party/flutter_chrome_cast
  screen_protector:
    path: ../packages/platform_player/third_party/screen_protector
  stockfish:
    path: ../packages/stubs/stockfish_stub
  chess:
    path: ../packages/stubs/chess_stub
  flame:
    path: ../packages/stubs/flame_stub
  google_mlkit_text_recognition:
    path: ../packages/stubs/mlkit_stub
  google_mlkit_image_labeling:
    path: ../packages/stubs/mlkit_image_labeling_stub
  media_kit_libs_android_video:
    path: ../packages/stubs/media_kit_libs_android_video_stub
  flutter_image_compress:
    path: ../packages/stubs/flutter_image_compress_stub

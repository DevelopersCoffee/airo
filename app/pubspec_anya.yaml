name: airo_app
description: "Anya - Your Personal Nutrition Planner"
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  file_picker: ">=8.0.0 <13.0.0"
  airo_pro_bootstrap:
    path: ../packages/airo_pro_bootstrap
  core_app_shell:
    path: ../packages/core_app_shell
  core_entitlements:
    path: ../packages/core_entitlements
  core_ui:
    path: ../packages/core_ui
  core_product_shell:
    path: ../packages/core_product_shell
  core_workers:
    path: ../packages/core_workers
  feature_anya:
    path: ../packages/feature_anya
  feature_anya_core:
    path: ../packages/feature_anya_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

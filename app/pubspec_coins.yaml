name: airo_app
description: "Airo Coin - local-first shared expenses and secure vault"
publish_to: none
version: 0.0.7+12

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: ^17.3.0
  # Shared expenses reuse the legacy Drift-backed coins store in
  # `app/lib/features/coins` until package-first migration (#938–#942).
  drift: ^2.32.1
  path: 1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.5.42
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  uuid: ^4.5.3
  share_plus: ^13.3.0
  equatable: ^2.1.0
  airo_pro_bootstrap:
    path: ../packages/airo_pro_bootstrap
  core_app_shell:
    path: ../packages/core_app_shell
  core_entitlements:
    path: ../packages/core_entitlements
  core_ui:
    path: ../packages/core_ui
  core_product_shell:
    path: ../packages/core_product_shell
  feature_coin:
    path: ../packages/feature_coin
  feature_coins_core:
    path: ../packages/feature_coins_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

dependency_overrides:
  # The published Android plugin metadata omits its implementation class.
  screen_protector:
    path: ../packages/platform_player/third_party/screen_protector

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

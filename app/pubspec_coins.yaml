name: airo_app
description: "Airo Coins - focused local-first finance vault"
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  go_router: ^17.3.0
  airo_pro_bootstrap:
    path: ../packages/airo_pro_bootstrap
  core_entitlements:
    path: ../packages/core_entitlements
  core_product_shell:
    path: ../packages/core_product_shell
  feature_coin:
    path: ../packages/feature_coin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

dependency_overrides:
  # The published Android plugin metadata omits its implementation class.
  screen_protector:
    path: ../packages/third_party/screen_protector

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

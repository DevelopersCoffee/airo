org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# Play Console rec on 19 (0.0.1): 26% R8 optimization/obfuscation/shrinking.
# Full mode is AGP 8+ default; spell it so a local override cannot silently
# disable it. Optimized resource shrinking is the extra AGP pass that actually
# moves Play's shrinking score on a minified + resource-shrunk release.
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
# Flutter and several plugin modules still require AGP 9 compatibility opt-outs.
android.builtInKotlin=false
android.newDsl=false
# Suppress Java warnings as errors for third-party plugins
android.suppressUnsupportedCompileSdk=34
# Don't treat warnings as errors
android.lint.checkAllWarnings=false
# Disable Flutter's automatic abiFilters for debug builds
flutter.disableAbiFilters=true
# Use universal APK for debug builds
flutter.universalApk=true
# Disable Gradle caching and daemon to avoid cache corruption
org.gradle.caching=false
org.gradle.daemon=false
# Use custom Gradle cache directory
org.gradle.user.home=/c/Users/chauh/develop/airo_super_app/.gradle_cache

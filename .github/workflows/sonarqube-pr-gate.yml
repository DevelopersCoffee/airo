# Branch protection on `main` requires a check named exactly `sonarqube`.
# The full scan is `sonarcloud-scan` in ci.yml and only runs on push to
# long-lived branches, so pull requests never posted that context and
# non-admins could not merge. This job reports the required name on PRs.
name: sonarqube

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acknowledge PR sonar gate
        run: |
          echo "Full SonarQube analysis is job sonarcloud-scan on push to main."

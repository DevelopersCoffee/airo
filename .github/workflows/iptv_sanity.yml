name: IPTV Sanity Pipeline

on:
  schedule:
    - cron: '17 2 * * 1'
  push:
    tags:
      - 'v*'
  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_validation:
        description: 'Skip stream validation (faster)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  WORKING_DIR: iptv-data
  # Gist ID for publishing IPTV data (create a public gist and set this)
  GIST_ID: ${{ secrets.IPTV_GIST_ID }}

jobs:
  pipeline:
    name: Run IPTV Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'iptv-data/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install bounded stream probe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      
      - name: Run linting
        run: |
          pip install ruff
          ruff check src/
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Run pipeline
        id: pipeline
        run: |
          if [ "${{ github.event.inputs.skip_validation }}" == "true" ]; then
            timeout 15m python -m src.main --config config/default.yaml --skip-validation
          else
            timeout 15m python -m src.main --config config/default.yaml
          fi
      
      - name: Verify output
        run: |
          # Check that output files exist
          test -f output/current/iptv_channels.json
          test -f output/current/taxonomies.json
          test -f output/current/manifest.json
          
          # Validate JSON
          python -c "import json; json.load(open('output/current/iptv_channels.json'))"
          
          # Check minimum channel count
          CHANNEL_COUNT=$(python -c "import json; d=json.load(open('output/current/iptv_channels.json')); print(len(d['channels']))")
          echo "Channel count: $CHANNEL_COUNT"
          
          if [ "$CHANNEL_COUNT" -lt 50 ]; then
            echo "Error: Channel count ($CHANNEL_COUNT) below minimum threshold (50)"
            exit 1
          fi

      - name: Build bounded EPG grab input
        run: |
          curl --fail --location --retry 3 \
            https://iptv-org.github.io/api/guides.json \
            --output /tmp/iptv-org-guides.json
          python -m src.epg_artifacts generate \
            --channels output/current/iptv_channels.json \
            --guides /tmp/iptv-org-guides.json \
            --countries IN \
            --max-guides-per-channel 2 \
            --output /tmp/airo.channels.xml

      - name: Run upstream EPG grabber
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git iptv-org-epg
          cd iptv-org-epg
          npm ci
          timeout 30m npm run grab -- \
            --channels=/tmp/airo.channels.xml \
            --output=/tmp/airo-guide.xml \
            --maxConnections=10

      - name: Publish per-country EPG artifacts
        run: |
          python -m src.epg_artifacts publish \
            --channels output/current/iptv_channels.json \
            --grabbed /tmp/airo-guide.xml \
            --output-directory output/current \
            --manifest output/current/manifest.json \
            --countries IN \
            --minimum-programmes 1 \
            --minimum-coverage-percent 70
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: iptv-data-${{ github.run_number }}
          path: |
            iptv-data/output/current/
            iptv-data/output/reports/
          retention-days: 30

      - name: Publish to GitHub Gist
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Get version from manifest
          VERSION=$(python -c "import json; print(json.load(open('output/current/manifest.json'))['version'])")
          echo "Publishing IPTV data v${VERSION} to Gist..."

          # Read file contents and escape for JSON
          CHANNELS_CONTENT=$(python -c "import json; print(json.dumps(open('output/current/iptv_channels.json').read()))")
          TAXONOMIES_CONTENT=$(python -c "import json; print(json.dumps(open('output/current/taxonomies.json').read()))")
          MANIFEST_CONTENT=$(python -c "import json; print(json.dumps(open('output/current/manifest.json').read()))")
          M3U_CONTENT=$(python -c "import json; print(json.dumps(open('output/current/iptv_channels.m3u').read()))")

          # Create JSON payload for Gist update
          cat > /tmp/gist_payload.json << EOF
          {
            "description": "IPTV Channels Data v${VERSION} - Auto-updated by IPTV Sanity Pipeline",
            "files": {
              "iptv_channels.json": {
              "content": ${CHANNELS_CONTENT}
            },
            "taxonomies.json": {
              "content": ${TAXONOMIES_CONTENT}
            },
              "manifest.json": {
                "content": ${MANIFEST_CONTENT}
              },
              "iptv_channels.m3u": {
                "content": ${M3U_CONTENT}
              }
            }
          }
          EOF

          # Update the Gist using GitHub API
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/${{ env.GIST_ID }}" \
            -d @/tmp/gist_payload.json

          echo "✅ Published to Gist: https://gist.github.com/${{ env.GIST_ID }}"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: pipeline
    if: failure()
    
    steps:
      - name: Log failure
        run: |
          echo "IPTV Pipeline failed! Manual intervention may be required."
          echo "Check the pipeline logs for details."

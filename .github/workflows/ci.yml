# =============================================================================
# Continuous Integration Workflow - Optimized
# =============================================================================
# On PR: Runs checks plus multi-platform APK size guardrails
# On Push to main: Runs comprehensive checks including app tests with coverage
# =============================================================================
name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_full_android:
        description: 'Build the full Airo Android APK even for manual runs'
        required: false
        default: true
        type: boolean

# Cancel any in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  # ============================================
  # Code Quality (runs on all events)
  # ============================================
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies (parallel)
        run: |
          (cd packages/core_domain && flutter pub get) &
          (cd packages/core_ui && flutter pub get) &
          (cd packages/core_data && flutter pub get) &
          (cd packages/core_ai && flutter pub get) &
          (cd packages/core_auth && flutter pub get) &
          wait
          cd app && flutter pub get

      - name: Run code generation
        run: |
          # feature_mind's *.freezed.dart is gitignored; the app depends on
          # feature_mind since SSOT Phase 3, so its codegen must run first.
          scripts/run-ci-codegen.sh

      - name: Configure firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          cd app
          if [[ -n "$FIREBASE_OPTIONS_DART_B64" ]]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
            echo "Using FIREBASE_OPTIONS_DART_B64."
          else
            cp lib/firebase_options.dart.template lib/firebase_options.dart
            echo "::warning::FIREBASE_OPTIONS_DART_B64 is not set; using placeholder firebase_options.dart."
          fi

      - name: Run Flutter Analyze
        run: |
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # Covers `lib test`, matching the code-quality job. When this checked only
      # `lib`, test-file drift passed here and failed one job later -- and,
      # because a pull request's CI builds a merge commit, it failed on whatever
      # PR came next rather than the one that introduced it. That misattribution
      # cost real time twice on 2026-08-01/02 (#1381, #1441) before the cause
      # was clear. Catch it in the job that owns formatting.
      - name: Check formatting
        run: |
          cd app
          find lib test -name "*.dart" ! -name "*.g.dart" ! -name "*.freezed.dart" -print0 | xargs -0 dart format --set-exit-if-changed

      - name: Enforce bundled model artifact guardrail
        run: |
          chmod +x scripts/check-bundled-model-artifacts.sh
          scripts/check-bundled-model-artifacts.sh

      # `dart.library.html` is false under dart2wasm, so the inverted
      # `import 'real.dart' if (dart.library.html) 'stub.dart'` shape leaks
      # native/io code into wasm web builds instead of falling back to the
      # web-safe stub (#1679).
      - name: Reject unsafe dart.library.html conditional imports
        run: |
          chmod +x scripts/check-no-dart-library-html-imports.sh
          scripts/check-no-dart-library-html-imports.sh

      # Library modules pin their own compileSdk; the app module's value does
      # not override them. Catch SDK drift before Gradle's AAR metadata check
      # fails a full-variant build (#1575).
      - name: Enforce Android SDK baseline across modules
        run: |
          chmod +x scripts/check-android-sdk-baseline.sh scripts/test-check-android-sdk-baseline.sh
          scripts/test-check-android-sdk-baseline.sh
          scripts/check-android-sdk-baseline.sh

      # Scheduled notifications deserialize through Gson, so R8 renaming the
      # plugin's model fields breaks them in release builds only. No test layer
      # can see that, which is why it needs a gate here.
      - name: Enforce Gson keep rules for scheduled notifications
        run: |
          chmod +x scripts/check-gson-keep-rules.sh
          scripts/check-gson-keep-rules.sh

      - name: Validate platform build profiles
        run: |
          chmod +x scripts/check-ci-cache-policy.py scripts/check-build-profiles.py scripts/generate-release-manifest.py scripts/test-generate-release-manifest.sh scripts/generate-release-qualification-report.py scripts/test-generate-release-qualification-report.sh
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "ok #{f}" }' \
            .github/workflows/release-orchestrator.yml \
            .github/workflows/airo-tv-release.yml \
            .github/workflows/airo-mobile-tablet-release.yml \
            .github/workflows/virustotal-scan.yml
          python3 -m py_compile scripts/check-ci-cache-policy.py scripts/check-build-profiles.py scripts/generate-release-manifest.py scripts/generate-release-qualification-report.py scripts/resolve_release_tv_apk.py scripts/test_resolve_release_tv_apk.py
          python3 scripts/test_resolve_release_tv_apk.py
          scripts/check-ci-cache-policy.py
          scripts/check-build-profiles.py
          scripts/test-generate-release-manifest.sh
          scripts/test-generate-release-qualification-report.sh

  # ============================================
  # Core Package Tests (runs on all events - fast)
  # ============================================
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get core package dependencies (parallel)
        run: |
          (cd packages/core_domain && flutter pub get) &
          (cd packages/core_ui && flutter pub get) &
          (cd packages/core_data && flutter pub get) &
          (cd packages/core_ai && flutter pub get) &
          (cd packages/core_auth && flutter pub get) &
          wait

      - name: Run core package tests (parallel)
        run: |
          echo "Running core package tests in parallel..."
          (cd packages/core_domain && flutter test --reporter=compact) &
          (cd packages/core_data && flutter test --reporter=compact) &
          (cd packages/core_ai && flutter test --reporter=compact) &
          (cd packages/core_auth && flutter test --reporter=compact) &
          wait
          echo "All core package tests completed!"

      # feature_mind carries the M22 runtime port and the R01-R04 rule tests.
      # Its *.freezed.dart is gitignored, so codegen must run before the tests
      # can compile at all -- without this step the package fails with a
      # misleading "Couldn't find constructor ProcessingEvent_*".
      - name: Run Airo Mind package tests
        run: |
          cd packages/feature_mind
          flutter pub get
          dart run build_runner build
          flutter test --reporter=compact

      # Rules R03 and R05 are repo gates, not package tests. A gate CI never
      # invokes is not a gate.
      - name: Check Airo Mind design rules (R03, R05)
        run: |
          scripts/check-mind-projection-routes.sh
          scripts/check-mind-private-devices.sh

  # ============================================
  # Variant Dependency Profiles
  # ============================================
  variant-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-variant-profiles-${{ hashFiles('**/pubspec*.yaml', '.github/airo-build-profiles.json') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Validate dependency profile constraints
        run: |
          chmod +x scripts/check-build-profiles.py scripts/check-variant-pubspecs.sh scripts/generate-release-manifest.py scripts/test-generate-release-manifest.sh scripts/generate-release-qualification-report.py scripts/test-generate-release-qualification-report.sh
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "ok #{f}" }' \
            .github/workflows/release-orchestrator.yml \
            .github/workflows/airo-tv-release.yml \
            .github/workflows/airo-mobile-tablet-release.yml \
            .github/workflows/virustotal-scan.yml
          python3 -m py_compile scripts/check-build-profiles.py scripts/generate-release-manifest.py scripts/generate-release-qualification-report.py scripts/resolve_release_tv_apk.py scripts/test_resolve_release_tv_apk.py
          python3 scripts/test_resolve_release_tv_apk.py
          scripts/check-build-profiles.py
          scripts/check-variant-pubspecs.sh
          scripts/test-generate-release-manifest.sh
          scripts/test-generate-release-qualification-report.sh

  # ============================================
  # Airo Mind shell (flavour-scoped)
  # ============================================
  # Flavours are separate pubspecs, so `lib/main_mind.dart`, `lib/core/mind/**`
  # and `test_mind/**` resolve under NO pubspec any other job installs.
  # `app/analysis_options.yaml` excludes them for exactly that reason, and the
  # default `flutter analyze` / `flutter test` therefore never sees them. This
  # job is the only thing that does: it swaps in the Mind profile the way
  # `app/tool/run_mind_macos.sh` does, then analyses, tests and compiles
  # against it.
  #
  # The analysis options are swapped too, because `dart analyze <path>` cannot
  # override an exclude -- it reports "No issues found!" on a hard type error
  # in an excluded file. See the header of `app/analysis_options_mind.yaml`.
  airo-mind-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push only. The identical job in `.github/workflows/pr-checks.yml` is the
    # PR gate, and both workflows fire on `pull_request` -- without this an
    # ~8-minute job would run twice per PR for one result. Same idiom as
    # `build-web`, `security-scan` and `lint` below.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-mind-${{ hashFiles('app/pubspec_mind.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # feature_mind's *.freezed.dart is gitignored, so without codegen the
      # shell fails to compile with a misleading "Couldn't find constructor
      # ProcessingEvent_*" from inside the package.
      - name: Generate feature_mind code
        run: |
          cd packages/feature_mind
          flutter pub get
          dart run build_runner build

      - name: Swap in the Mind flavour
        run: |
          cp app/pubspec_mind.yaml app/pubspec.yaml
          cp app/analysis_options_mind.yaml app/analysis_options.yaml
          cd app
          flutter pub get

      - name: Configure firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          cd app
          if [[ -n "$FIREBASE_OPTIONS_DART_B64" ]]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
            echo "Using FIREBASE_OPTIONS_DART_B64."
          else
            cp lib/firebase_options.dart.template lib/firebase_options.dart
            echo "::warning::FIREBASE_OPTIONS_DART_B64 is not set; using placeholder firebase_options.dart."
          fi

      # Same flags as the `code-quality` job: infos and warnings are advisory
      # in this repo, errors are not.
      #
      # `integration_test/mind_journey_device_test.dart` is analysed here so
      # the gated Pixel 9 journey (#1771) cannot drift against the Mind
      # pubspec. Opt-in via AIRO_RUN_MIND_JOURNEY; CI never executes it.
      - name: Analyze the Mind shell
        run: |
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/main_mind.dart lib/core/mind \
            integration_test/mind_journey_device_test.dart

      - name: Run Mind shell tests
        run: |
          cd app
          flutter test test_mind/ --reporter=compact \
            --dart-define=APP_VARIANT=mind

      # `flutter test` compiles for the host only. This proves the profile also
      # compiles the entrypoint into a device bundle -- the whole point of
      # expanding it.
      #
      # The Android APK build (`scripts/build-mind.sh`) is deliberately NOT the
      # gate here, and no longer because it is broken. Both original blockers
      # are closed: the Gradle 9 `Project.exec()` break in the vendored cargokit
      # plugin is patched to `ExecOperations`, and the APK builds, installs and
      # runs on device (#1550).
      #
      # What remains is narrower, and is a HOST constraint rather than a
      # failure:
      #
      #   - arm64 only. `llama-cpp-sys-2`'s build script panics on
      #     `armv7-linux-androideabi`, so `scripts/build-mind.sh` pins
      #     `--target-platform=android-arm64`. Mind is an arm64 product.
      #   - Cross-compiling `whisper-rs-sys` from a macOS host still fails to
      #     link (`could not find native static library ggml-blas`) because its
      #     build script evaluates `cfg!(macos)` on the HOST. A Linux runner
      #     builds it fine.
      #
      # So this could be promoted to `scripts/build-mind.sh` on a Linux runner.
      # It is not, because compiling whisper.cpp and llama.cpp for the NDK adds
      # tens of minutes to every PR, and GitHub Actions minutes are a costed
      # shared resource. The device path is covered by the release workflow.
      - name: Compile the Mind entrypoint
        run: |
          cd app
          flutter build bundle --target=lib/main_mind.dart --dart-define=APP_VARIANT=mind

  # ============================================
  # App Tests with Coverage
  # Runs on every push to main, and on PRs targeting main/v2.
  # ============================================
  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'v2'))
    needs: [analyze, test-core]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies (parallel)
        run: |
          (cd packages/core_domain && flutter pub get) &
          (cd packages/core_ui && flutter pub get) &
          (cd packages/core_data && flutter pub get) &
          (cd packages/core_ai && flutter pub get) &
          (cd packages/core_auth && flutter pub get) &
          wait
          cd app && flutter pub get

      - name: Run code generation
        run: |
          # feature_mind's *.freezed.dart is gitignored; the app depends on
          # feature_mind since SSOT Phase 3, so its codegen must run before
          # app tests compile.
          scripts/run-ci-codegen.sh

      - name: Configure firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          cd app
          if [[ -n "$FIREBASE_OPTIONS_DART_B64" ]]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
            echo "Using FIREBASE_OPTIONS_DART_B64."
          else
            cp lib/firebase_options.dart.template lib/firebase_options.dart
            echo "::warning::FIREBASE_OPTIONS_DART_B64 is not set; using placeholder firebase_options.dart."
          fi

      - name: Run app tests with coverage
        run: |
          cd app
          flutter test --coverage --reporter=compact
          # Mind-shell tests (`test_mind/`) exercise `lib/core/mind/**`, which is
          # excluded from the default analyzer graph but still ships in app/lib
          # and counts toward Sonar new-code coverage. Merge their lcov trace so
          # Sonar sees the same lines the airo-mind-shell job already proves.
          cp coverage/lcov.info coverage/lcov.base.info
          if ! command -v lcov >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y lcov
          fi
          flutter test test_mind/ --coverage --merge-coverage \
            --reporter=compact --dart-define=APP_VARIANT=mind

      - name: Convert coverage to SonarQube generic format
        if: always() && github.event_name == 'push'
        run: |
          python3 scripts/lcov_to_sonar_generic_coverage.py \
            app/coverage/lcov.info \
            --prefix "app/" \
            --out app/coverage/sonar-generic-coverage.xml

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./app/coverage/lcov.info
          flags: flutter
          name: flutter-coverage

      - name: Upload coverage artifact for SonarCloud
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: lcov-coverage
          path: |
            app/coverage/lcov.info
            app/coverage/sonar-generic-coverage.xml
          retention-days: 1
          if-no-files-found: warn

  # ============================================
  # Build Android - Multi-Platform Matrix
  # ============================================
  # Builds all platform variants:
  # - full: Airo
  # - tv: IPTV only
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: full
            target: lib/main.dart
            variant: full
            app_platform: mobileFull
            use_stubs: false
            enforce_size: false
            size_target_mb: 450
            description: "Full app with all features (size report only)"
          - name: tv
            target: lib/main_tv.dart
            variant: tv
            app_platform: androidTv
            use_stubs: true
            enforce_size: true
            pubspec: pubspec_tv.yaml
            size_target_mb: 35
            description: "Android TV (IPTV only)"
          - name: coins
            target: lib/main_coins.dart
            variant: coins
            app_platform: mobileFull
            use_stubs: true
            enforce_size: true
            pubspec: pubspec_coins.yaml
            size_target_mb: 25
            description: "Airo Coins (local-first vault only)"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Android build scope
        id: android_scope
        env:
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ' ') || '' }}
          BUILD_FULL_ANDROID: ${{ github.event.inputs.build_full_android }}
        run: |
          should_build=true
          reason="required for this event"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ matrix.platform.name }}" = "full" ]; then
            if [[ " $PR_LABELS " == *" full-android-build "* ]]; then
              reason="PR has full-android-build label"
            else
              should_build=false
              reason="full is skipped on PRs; add full-android-build label to run it"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ matrix.platform.name }}" = "full" ] && \
             [ "$BUILD_FULL_ANDROID" != "true" ]; then
            should_build=false
            reason="manual run disabled full"
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason"

      - name: Setup Java
        if: steps.android_scope.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        if: steps.android_scope.outputs.should_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        if: steps.android_scope.outputs.should_build == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ matrix.platform.name }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ matrix.platform.name }}-
            pub-${{ runner.os }}-

      - name: Cache Gradle
        if: steps.android_scope.outputs.should_build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Only the `full` matrix leg builds from app/pubspec.yaml unmodified,
      # which depends on feature_mind (an FFI plugin -> cargokit -> cargo).
      # `tv` and `coins` swap in a stub pubspec (matrix.platform.use_stubs)
      # that drops feature_mind entirely, so they don't need this -- skip it
      # there to avoid burning CI minutes on an unused toolchain install
      # (see the "Run code generation" step below, gated the same way).
      # Same toolchain/target as `rust-core.yml`'s Android job (arm64-only,
      # matching this job's --target-platform=android-arm64 build).
      - name: Install Rust toolchain (for cargokit / feature_mind)
        if: steps.android_scope.outputs.should_build == 'true' && matrix.platform.name == 'full'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ===========================================
      # Firebase Configuration Setup
      # ===========================================
      - name: Create Firebase Config
        if: steps.android_scope.outputs.should_build == 'true'
        run: |
          cd app
          case "${{ matrix.platform.variant }}" in
            full) package_name="io.airo.app" ;;
            tv) package_name="com.developerscoffee.tv.midas" ;;
            coins) package_name="io.airo.app.coins" ;;
            *)
              echo "::error::Unknown Android variant: ${{ matrix.platform.variant }}"
              exit 1
              ;;
          esac
          echo "::warning::Using CI placeholder Firebase config for validation build."
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "airo-ci-placeholder",
              "storage_bucket": "airo-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "__PACKAGE_NAME__"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          sed -i "s/__PACKAGE_NAME__/$package_name/g" android/app/google-services.json
          if [[ ! -f android/app/google-services.json || ! -s android/app/google-services.json ]]; then
            echo "::error::Failed to create google-services.json."
            exit 1
          fi
          echo "✅ Firebase configuration created successfully for $package_name"

      - name: Configure firebase_options.dart
        if: steps.android_scope.outputs.should_build == 'true'
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          cd app
          if [[ -n "$FIREBASE_OPTIONS_DART_B64" ]]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
            echo "Using FIREBASE_OPTIONS_DART_B64."
          else
            cp lib/firebase_options.dart.template lib/firebase_options.dart
            echo "::warning::FIREBASE_OPTIONS_DART_B64 is not set; using placeholder firebase_options.dart (Firebase init will be skipped at runtime)."
          fi

      - name: Create CI validation signing config
        if: steps.android_scope.outputs.should_build == 'true'
        run: |
          cd app/android
          keytool -genkeypair \
            -v \
            -keystore ci-validation.keystore \
            -storepass ci-validation-password \
            -keypass ci-validation-password \
            -alias ci-validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Airo CI Validation,O=DevelopersCoffee,C=US"
          {
            echo "storeFile=ci-validation.keystore"
            echo "storePassword=ci-validation-password"
            echo "keyAlias=ci-validation"
            echo "keyPassword=ci-validation-password"
          } > key.properties
          chmod 600 ci-validation.keystore key.properties
          echo "✅ CI validation signing config created"

      # ===========================================
      # Apply Platform-Specific Pubspec (if using stubs)
      # ===========================================
      - name: Apply platform-specific pubspec
        if: steps.android_scope.outputs.should_build == 'true' && matrix.platform.use_stubs
        run: |
          cd app
          echo "📦 Applying ${{ matrix.platform.pubspec }} for ${{ matrix.platform.name }} build..."
          cp pubspec.yaml pubspec.yaml.backup
          cp ${{ matrix.platform.pubspec }} pubspec.yaml
          echo "✅ Platform-specific pubspec applied"

      - name: Get dependencies
        if: steps.android_scope.outputs.should_build == 'true'
        run: |
          cd packages/core_domain && flutter pub get
          cd ../core_ui && flutter pub get
          cd ../core_data && flutter pub get
          cd ../core_ai && flutter pub get
          cd ../core_auth && flutter pub get
          cd ../../app && flutter pub get

      - name: Patch Android plugin Gradle files
        if: steps.android_scope.outputs.should_build == 'true'
        run: scripts/patch-android-plugin-gradle.sh

      - name: Run code generation
        if: steps.android_scope.outputs.should_build == 'true' && matrix.platform.name == 'full'
        run: |
          # feature_mind's *.freezed.dart is gitignored; the app depends on
          # feature_mind since SSOT Phase 3, so its codegen must run first.
          scripts/run-ci-codegen.sh

      - name: Build APK (Release) - ${{ matrix.platform.description }}
        if: steps.android_scope.outputs.should_build == 'true'
        env:
          # LiteRT-LM (Gemini Nano) lives in a private Maven registry on
          # google/generative-ai-android. The default Actions GITHUB_TOKEN
          # is scoped to this repo only and can't read it; AIRO_LITERTLM_TOKEN
          # is a PAT with read:packages on that repo (see issue #854).
          # app/android/build.gradle.kts treats any non-empty GITHUB_TOKEN as
          # "LiteRT-LM available" and tries to fetch it, so do NOT fall back
          # to secrets.GITHUB_TOKEN here -- that token is always present but
          # lacks cross-repo package read, which turns the graceful stub
          # fallback into a hard build failure. Leave the var unset when the
          # PAT secret isn't configured.
          GITHUB_TOKEN: ${{ secrets.AIRO_LITERTLM_TOKEN }}
        run: |
          cd app
          echo "🔨 Building ${{ matrix.platform.name }} APK..."
          flutter build apk --release \
            --target=${{ matrix.platform.target }} \
            --target-platform=android-arm64 \
            --dart-define=APP_VARIANT=${{ matrix.platform.variant }} \
            --dart-define=APP_PLATFORM=${{ matrix.platform.app_platform }} \
            --tree-shake-icons \
            --split-debug-info=build/debug-info-${{ matrix.platform.name }} \
            --obfuscate
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "✅ Build complete"

      # ===========================================
      # CV-030: Assert TV APK excludes libmpv + FFmpeg native libs
      # ===========================================
      # media_kit is bundled on mobile flavors (as the codec/decoder fallback)
      # but must NOT ship on the TV flavor — storage-starved TV boxes cannot
      # absorb the per-arch libmpv + FFmpeg libs, and videoPlayer is the sole
      # engine there per the CV-030 shipping matrix. The exclusion is wired in
      # app/android/app/build.gradle.kts packaging.jniLibs.excludes; this step
      # enforces it stays wired.
      - name: Assert TV APK excludes mpv native libs
        if: steps.android_scope.outputs.should_build == 'true' && matrix.platform.variant == 'tv'
        run: |
          apk="app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::TV APK not found at $apk"
            exit 1
          fi
          echo "🔎 Scanning $apk for mpv/FFmpeg .so entries..."
          forbidden='(libmpv|libplayer|libavcodec|libavformat|libavutil|libavdevice|libavfilter|libswresample|libswscale)\.so$'
          leaks=$(unzip -l "$apk" | awk '{print $4}' | grep -E "$forbidden" || true)
          if [ -n "$leaks" ]; then
            echo "::error::TV APK leaks mpv/FFmpeg native libs (CV-030 exclusion regression):"
            echo "$leaks"
            exit 1
          fi
          echo "✅ TV APK contains no libmpv/FFmpeg .so entries"

      # ===========================================
      # Verify APK Size Targets
      # ===========================================
      - name: Check APK sizes
        if: steps.android_scope.outputs.should_build == 'true'
        id: apk_sizes
        continue-on-error: ${{ matrix.platform.enforce_size == false }}
        env:
          APK_SIZE_COMPONENT: ${{ matrix.platform.name }}
          APK_SIZE_APK_GLOB: app/build/app/outputs/flutter-apk/app-*-release.apk
          APK_SIZE_REPORT_FILE: apk-size-${{ matrix.platform.name }}.md
          # Growth past the recorded baseline blocks a pull request, where a
          # human can attribute it. On main it is reported instead: a failing
          # run there skips "Generate APK baseline update" below and the
          # update-apk-size-baselines job that consumes it, so enforcing the
          # delta on main deadlocks the gate against a baseline it can never
          # refresh. The absolute per-component budget stays enforced on both.
          APK_SIZE_BASELINE_DELTA_ENFORCED: ${{ github.event_name == 'pull_request' }}
        run: |
          scripts/check-apk-size.sh

      - name: Upload APK size report
        if: github.event_name == 'pull_request' && steps.android_scope.outputs.should_build == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-size-report-${{ matrix.platform.name }}
          path: apk-size-${{ matrix.platform.name }}.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate APK baseline update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.android_scope.outputs.should_build == 'true'
        env:
          APK_SIZE_COMPONENT: ${{ matrix.platform.name }}
          APK_SIZE_BUDGET_MB: ${{ matrix.platform.size_target_mb }}
        run: |
          mkdir -p apk-size-baselines
          output="apk-size-baselines/${APK_SIZE_COMPONENT}.tsv"
          : > "$output"
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            bytes=$(stat -c%s "$apk")
            artifact=$(basename "$apk")
            printf '%s\t%s\t%s\t%s\n' "$APK_SIZE_COMPONENT" "$artifact" "$bytes" "$APK_SIZE_BUDGET_MB" >> "$output"
          done

      - name: Upload APK baseline update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.android_scope.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-size-baseline-${{ matrix.platform.name }}
          path: apk-size-baselines/${{ matrix.platform.name }}.tsv
          retention-days: 7

      # ===========================================
      # Restore Original Pubspec (if using stubs)
      # ===========================================
      - name: Restore original pubspec
        if: steps.android_scope.outputs.should_build == 'true' && matrix.platform.use_stubs && always()
        run: |
          cd app
          if [ -f pubspec.yaml.backup ]; then
            mv pubspec.yaml.backup pubspec.yaml
            echo "✅ Original pubspec restored"
          fi

      - name: Upload Release APKs
        if: steps.android_scope.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.platform.name }}-release
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

      - name: Upload Debug Info
        if: steps.android_scope.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.platform.name }}-debug-info
          path: app/build/debug-info-${{ matrix.platform.name }}/
          retention-days: 90

  # ============================================
  # PR APK Size Report Comment
  # ============================================
  comment-apk-size-report:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'pull_request' && always()
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Download APK size reports
        uses: actions/download-artifact@v6
        with:
          pattern: apk-size-report-*
          path: apk-size-reports
          merge-multiple: true

      - name: Combine APK size reports
        run: |
          {
            echo "# APK Size Guardrail Report"
            echo ""
            for report in apk-size-reports/*.md; do
              [ -f "$report" ] || continue
              cat "$report"
              echo ""
            done
          } > apk-size-report.md

      - name: Comment PR with APK size report
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- apk-size-guardrail -->';
            const body = `${marker}\n${fs.readFileSync('apk-size-report.md', 'utf8')}\n\n[View run details](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            let existing;

            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              existing = comments.data.find((comment) =>
                comment.user.type === 'Bot' && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning('Skipping APK size PR comment because this workflow token cannot write comments.');
                return;
              }
              throw error;
            }

  # ============================================
  # Update APK Size Baselines (main only)
  # ============================================
  update-apk-size-baselines:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download APK baseline updates
        uses: actions/download-artifact@v6
        with:
          pattern: apk-size-baseline-*
          path: apk-size-baseline-updates
          merge-multiple: true

      - name: Commit updated APK size baselines
        run: |
          chmod +x scripts/merge-apk-size-baselines.py
          scripts/merge-apk-size-baselines.py \
            --baseline .github/apk-size-baselines.tsv \
            --updates-dir apk-size-baseline-updates \
            --output .github/apk-size-baselines.tsv

          if git diff --quiet -- .github/apk-size-baselines.tsv; then
            echo "APK size baselines are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/apk-size-baselines.tsv
          git commit -m "ci: update APK size baselines"

          # main is a protected branch requiring status checks, which a direct
          # push from here can never satisfy -- it fails with GH006 on every
          # run. The old code pushed straight at main and downgraded the
          # rejection to a warning, so the measurement was computed, thrown
          # away, and the committed baselines silently froze (issue #1364).
          #
          # Park the refresh on a branch instead. Pushing a branch needs only
          # the contents:write this job already has, so the measured numbers
          # survive the run and a human can open the PR from them.
          refresh_branch="chore/apk-size-baselines"
          if git push --force origin "HEAD:$refresh_branch"; then
            echo "::warning::APK size baselines changed. Refresh pushed to '$refresh_branch' -- open a PR from it to land the update (see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$refresh_branch?expand=1)."
          else
            echo "::warning::Could not push the APK size baseline refresh to '$refresh_branch'. Update .github/apk-size-baselines.tsv manually via PR."
          fi
          exit 0

  # ============================================
  # Build Summary Job
  # ============================================
  build-summary:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'push'
    steps:
      - name: Generate Build Summary
        run: |
          echo "# 🚀 Multi-Platform Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All platform variants have been built successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Available Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Description | Target Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| full | Airo full app | report only |" >> $GITHUB_STEP_SUMMARY
          echo "| tv | IPTV only | <35MB |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release asset naming, visibility, and support policy: docs/release/V2_DISTRIBUTION_MATRIX.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the Actions tab." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build Web
  # ============================================
  build-web:
    runs-on: ubuntu-latest
    needs: [analyze, test-app]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies
        run: |
          cd packages/core_domain && flutter pub get
          cd ../core_ui && flutter pub get
          cd ../core_data && flutter pub get
          cd ../core_ai && flutter pub get
          cd ../core_auth && flutter pub get
          cd ../../app && flutter pub get

      - name: Run code generation
        run: |
          # feature_mind's *.freezed.dart is gitignored; the app depends on
          # feature_mind since SSOT Phase 3, so its codegen must run first.
          scripts/run-ci-codegen.sh

      - name: Configure firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          cd app
          if [[ -n "$FIREBASE_OPTIONS_DART_B64" ]]; then
            echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart
            echo "Using FIREBASE_OPTIONS_DART_B64."
          else
            cp lib/firebase_options.dart.template lib/firebase_options.dart
            echo "::warning::FIREBASE_OPTIONS_DART_B64 is not set; using placeholder firebase_options.dart."
          fi

      - name: Build Web
        run: |
          cd app
          flutter build web --release

      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: app/build/web
          retention-days: 14

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: 'trivy-results.sarif'
        # Private forks without GitHub Advanced Security reject SARIF uploads.
        # Keep Trivy authoritative while treating publication as optional.
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd app
          flutter pub get

  # ============================================
  # SonarCloud CI-based Analysis
  # Runs only on push to long-lived branches (main, master, v2, release/*).
  # Does NOT run on PRs to prevent blocking PR feedback loops.
  # ============================================
  sonarcloud-scan:
    runs-on: ubuntu-latest
    needs: [test-app]
    if: >
      always() &&
      (needs.test-app.result == 'success' || needs.test-app.result == 'failure') &&
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'v2' || startsWith(github.ref_name, 'release/'))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: lcov-coverage
          path: app/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd app
          flutter pub get

      - name: Run Snyk Security Scan
        uses: snyk/actions@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=app/pubspec.yaml
        continue-on-error: true

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

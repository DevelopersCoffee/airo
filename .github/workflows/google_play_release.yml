name: Google Play Store Internal Deployment

on:
  push:
    tags:
      - 'v*' # Triggers automatically on version tags (e.g., v1.0.0)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Melos & Bootstrap Workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Decode Android Keystore & Production Credentials
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/upload-keystore.jks
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > app/android/play-service-account.json

      - name: Compile Production Android App Bundle (AAB)
        run: cd app && flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Deploy App Bundle to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: app/android/play-service-account.json
          packageName: io.airo.app # Use com.developerscoffee.tv.midas for Aika Stream TV flavor
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

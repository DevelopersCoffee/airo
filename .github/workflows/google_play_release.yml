name: Google Play Internal (Aika Stream TV)

# Tag-triggered internal-track upload for com.developerscoffee.tv.midas.
# This is not a generic `flutter build appbundle` of the phone flavor.
# Play OSS leaves Pro dart-defines empty. Overlay CI/secrets fill them.

on:
  push:
    tags:
      - 'aika-stream-v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve version
        run: |
          eval "$(scripts/aika_stream_version.sh)"
          echo "BUILD_NAME=$AIKA_STREAM_BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$AIKA_STREAM_BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build TV AAB
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          AIRO_LICENSE_API_URL: ${{ secrets.AIRO_LICENSE_API_URL }}
          LICENSE_SNAPSHOT_PUBLIC_KEY: ${{ secrets.LICENSE_SNAPSHOT_PUBLIC_KEY }}
          AIRO_LICENSE_ANON_KEY: ${{ secrets.AIRO_LICENSE_ANON_KEY }}
        run: |
          bash scripts/build-tv.sh --aab-only \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Upload to Play internal
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.developerscoffee.tv.midas
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

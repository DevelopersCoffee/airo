# Airo Mind's bridge. Separate from flutter_rust_bridge.yaml because the two
# crates generate into different packages and neither should regenerate the
# other's bindings as a side effect of a codegen run.
rust_root: rust/airo_mind_runtime
rust_input: crate::api
dart_output: packages/feature_mind/lib/src
rust_output: rust/airo_mind_runtime/src/frb_generated.rs
# The api module is gated on the real backends -- codegen must enable them or
# it parses an empty crate and silently generates nothing. That failure mode is
# a successful "Done!" with no bindings, so it is worth stating here.
rust_features:
  - app

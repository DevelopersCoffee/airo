name: platform_downloads
description: Reusable progressive background-download contracts for Airo apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.airo.platform_downloads
        pluginClass: PlatformDownloadsPlugin
      ios:
        pluginClass: PlatformDownloadsPlugin


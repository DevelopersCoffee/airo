name: platform_calendar
description: Platform-neutral calendar capability for Airo. Native OS calendars behind CalendarService.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.airo.platform_calendar
        pluginClass: PlatformCalendarPlugin
      ios:
        pluginClass: PlatformCalendarPlugin
      macos:
        pluginClass: PlatformCalendarPlugin

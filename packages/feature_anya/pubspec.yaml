name: feature_anya
description: Anya presentation layer — diet profile, weekly meals, grocery, PDF import.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  core_product_shell:
    path: ../core_product_shell
  core_ui:
    path: ../core_ui
  core_workers:
    path: ../core_workers
  feature_anya_core:
    path: ../feature_anya_core
  file_picker: ">=8.0.0 <13.0.0"
  flutter_riverpod: 3.4.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  syncfusion_flutter_pdf: ^31.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

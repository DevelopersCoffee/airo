include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Written by flutter_rust_bridge_codegen and freezed. Lint findings here
    # cannot be fixed -- the next codegen run overwrites the fix.
    - lib/src/api/**
    - lib/src/frb_generated*.dart
    - "**/*.freezed.dart"
    # Vendored from Cargokit, with its own pubspec and its own analysis rules.
    # Analysing it here reports errors in code we do not own and must not edit.
    - cargokit/**

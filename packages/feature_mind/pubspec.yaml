name: feature_mind
description: "Airo Mind — record a meeting, get searchable minutes, entirely on device."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned to the same version as core_native and the Rust crate. Two
  # flutter_rust_bridge versions in one app is a link-time conflict.
  flutter_rust_bridge: 2.11.1
  # Microphone capture. Step 1 of the journey; nothing else in the workspace
  # records audio. Constitution §6 scorecard owed before release.
  record: ^6.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  # Required by flutter_rust_bridge for the generated sealed classes that carry
  # ProcessingEvent's variants.
  freezed_annotation: ^3.0.0
  # ModelDownloadService / ModelStorageManager -- model acquisition moves onto
  # the download pipeline Airo already uses, behind ModelProvider so the
  # source can change without touching MindService. See module.yaml.
  core_ai:
    path: ../core_ai

# An FFI plugin. Declaring the platforms is what makes the Flutter tool run
# cargokit's podspec/gradle/cmake hooks during a normal build -- without this
# block the Rust is never compiled, which is precisely the state core_native
# has been in.
flutter:
  # No bundled `assets/models/` any more. Neither app ships model weights in
  # the APK -- both default to `DownloadModelProvider`
  # (`docs/superpowers/specs/2026-08-07-airo-mind-abstraction-layer.md`).
  # `ModelInstaller` (`ADR-0018 §2`, Bundled) still exists as one
  # `ModelProvider` implementation for a build that intentionally bundles; it
  # needs its `assets:` block restored, and the assets it names, to work.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  # Test doubles construct DownloadArtifactRequest/DownloadProgress directly.
  platform_downloads:
    path: ../platform_downloads
  # mind_service_test.dart fakes path_provider's platform channel directly.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

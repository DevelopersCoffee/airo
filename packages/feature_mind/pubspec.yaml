name: feature_mind
description: "Airo Mind — record a meeting, get searchable minutes, entirely on device."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned to the same version as core_native and the Rust crate. Two
  # flutter_rust_bridge versions in one app is a link-time conflict.
  flutter_rust_bridge: 2.11.1
  # Microphone capture. Step 1 of the journey; nothing else in the workspace
  # records audio. Constitution §6 scorecard owed before release.
  record: ^6.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  # Required by flutter_rust_bridge for the generated sealed classes that carry
  # ProcessingEvent's variants.
  freezed_annotation: ^3.0.0
  # ModelDownloadService / ModelStorageManager -- model acquisition moves onto
  # the download pipeline Airo already uses, behind ModelProvider so the
  # source can change without touching MindService. See module.yaml.
  core_ai:
    path: ../core_ai
  core_entitlements:
    path: ../core_entitlements
  # Below: brought in from feature_assistant on the Phase 2 merge
  # (docs/superpowers/plans/2026-08-07-airo-mind-ssot-plan.md) -- the assistant
  # hub (chat, models, prompt lab, wellbeing) is now this package.
  flutter_riverpod: ^3.3.2
  go_router: ^17.1.0
  core_ui:
    path: ../core_ui
  core_product_shell:
    path: ../core_product_shell
  core_domain:
    path: ../core_domain
  core_data:
    path: ../core_data
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  dio: ^5.10.0
  equatable: ^2.1.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  llama_flutter_android: ^0.2.6
  # Metered-connection detection for the model download manager (#1457) --
  # same package and version core_data, platform_player and feature_iptv
  # already use for the same purpose.
  connectivity_plus: ^7.2.0
  # Markdown export (#1663): rendering the transcript body runs off the main
  # isolate once it crosses ~50 KB, per the repo's own parsing rule.
  core_workers:
    path: ../core_workers
  # Share-sheet + save-to-folder for markdown export (#1663). Same package,
  # same pinned version, as feature_iptv's backup/restore export -- see
  # platform_backup_document_gateway.dart there for the house pattern this
  # follows. TV builds swap both for packages/stubs/*_stub via
  # app/pubspec_overrides.yaml, same as feature_iptv.
  file_picker: 12.0.0-beta.7
  share_plus: 13.3.0

# An FFI plugin. Declaring the platforms is what makes the Flutter tool run
# cargokit's podspec/gradle/cmake hooks during a normal build -- without this
# block the Rust is never compiled, which is precisely the state core_native
# has been in.
flutter:
  # The assistant hub (merged in from feature_assistant, Phase 2 of
  # docs/superpowers/plans/2026-08-07-airo-mind-ssot-plan.md) uses Material
  # icons throughout; core_ui, one of its dependencies, assumes this is set.
  uses-material-design: true
  # No bundled `assets/models/` any more. Neither app ships model weights in
  # the APK -- both default to `DownloadModelProvider`
  # (`docs/superpowers/specs/2026-08-07-airo-mind-abstraction-layer.md`).
  # `ModelInstaller` (`ADR-0018 §2`, Bundled) still exists as one
  # `ModelProvider` implementation for a build that intentionally bundles; it
  # needs its `assets:` block restored, and the assets it names, to work.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      # iOS is deliberately NOT declared here. The podspec
      # (ios/feature_mind.podspec) has never built -- whisper.cpp and
      # llama.cpp each statically vendor their own copy of ggml under the
      # same symbol names, so the app link fails with 592 duplicate symbols
      # (measured, not predicted). There is no iOS CI to catch a regression
      # here, so leaving `ios:` declared would let `flutter build ios` claim
      # support it cannot deliver, and fail deep in the Xcode link stage
      # instead of cleanly at plugin resolution. Restore once #1546 phase 4
      # (two dynamic frameworks + a non-static-linking library_loader.dart
      # path) lands.
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  # Test doubles construct DownloadArtifactRequest/DownloadProgress directly.
  platform_downloads:
    path: ../platform_downloads
  # mind_service_test.dart fakes path_provider's platform channel directly.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.1
